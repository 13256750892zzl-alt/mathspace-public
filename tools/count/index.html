/* Module colors identify the experiment; avatar colors keep identifying people. */
:root {
  --bg: #0d101f;
  --panel: #181e34;
  --ink: #f0f3ff;
  --muted: #b5bfd8;
  --line: #414c6d;
  --cyan: #9bc9ff;
  --accent: #9bc9ff;
  --secondary: #bca7ff;
  --blue: #a5caff;
  --orange: #ffce91;
  --motion: cubic-bezier(.22,.75,.25,1);
}
body[data-module="1"] { --accent: #8de5bf; --secondary: #95cfff; }
body[data-module="2"] { --accent: #c6adff; --secondary: #f3b2d6; }
body[data-module="3"] { --accent: #ffd091; --secondary: #ffa8a1; }
body[data-module="4"] { --accent: #f7add2; --secondary: #c6adff; }
body[data-module="5"] { --accent: #ffb29f; --secondary: #ffda96; }
body[data-module="6"] { --accent: #8fdfed; --secondary: #9ebeff; }
body {
  --cyan: var(--accent);
  background:
    radial-gradient(ellipse at 4% 0%, #555db537, transparent 42rem),
    radial-gradient(ellipse at 96% 18%, #974a7933, transparent 38rem),

}
header { padding-top: 32px; padding-bottom: 24px; }
.mark {
  border-color: #bcadff99; border-radius: 14px; transform: rotate(-6deg);
  background: linear-gradient(145deg, #8d9dff35, #d885b820);
  box-shadow: inset 0 1px 0 #f1e8ff33, 0 12px 40px #6f64d918;
  color: #ddd0ff;
}
h1 { letter-spacing: -.5px; }
.brand small { color: #b8b9d9; }
nav {
  gap: 8px; padding-top: 8px; padding-bottom: 16px;
  scrollbar-width: thin; scrollbar-color: #72658d transparent;
}
nav button {
  --nav-color: #9bc9ff;
  border: 1px solid color-mix(in srgb, var(--nav-color) 24%, transparent);
  background: color-mix(in srgb, var(--nav-color) 7%, #161c30);
  color: var(--nav-color); border-radius: 999px; padding: 10px 17px;
  box-shadow: inset 0 1px 0 #ffffff0d;
}
nav button:nth-child(2) { --nav-color: #8de5bf; }
nav button:nth-child(3) { --nav-color: #c6adff; }
nav button:nth-child(4) { --nav-color: #ffd091; }
nav button:nth-child(5) { --nav-color: #f7add2; }
nav button:nth-child(6) { --nav-color: #ffb29f; }
nav button:nth-child(7) { --nav-color: #8fdfed; }
nav button.active {
  color: #17182d; border-color: var(--nav-color);
  background: linear-gradient(130deg, var(--nav-color), color-mix(in srgb, var(--nav-color) 70%, white));
  box-shadow: inset 0 1px 0 #ffffff88, 0 5px 22px color-mix(in srgb, var(--nav-color) 13%, transparent);
}
button, .person { transition: transform .28s var(--motion), background-color .28s var(--motion), border-color .28s var(--motion), box-shadow .28s var(--motion); }
button { border-radius: 12px; border-color: #67739166; background: #242c47; box-shadow: inset 0 1px 0 #ffffff0c; }
button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); background-color: #34405f; }
button:active:not(:disabled) { transform: scale(.98); }
button.active, .primary { background: var(--accent); color: #17182d; border-color: var(--accent); }
nav button:hover:not(:disabled) { background: color-mix(in srgb, var(--nav-color) 19%, #161c30); }
nav button.active:hover:not(:disabled) { background: var(--nav-color); }
.top-actions button { background: #20243c; border-radius: 999px; }
.intro { padding-top: 20px; padding-bottom: 28px; }
.eyebrow {
  display: inline-block; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-radius: 999px; padding: 4px 11px; font-size: 11px; letter-spacing: 1.6px;
}
h2 { font-size: clamp(27px, 2.65vw, 38px); margin-top: 14px; letter-spacing: -.7px; }
.workspace {
  padding: 7px; gap: 7px; border: 1px solid #b3b8e52e; border-radius: 26px;
  background: linear-gradient(145deg, #b2b9ed12, #db93b409 55%, #85cbb90b);
  box-shadow: inset 0 1px 0 #f3ecff1c, 0 24px 70px #090b1f18;
}
aside {
  border: 1px solid #bac5f21c; border-radius: 19px;

  box-shadow: inset 0 1px 0 #e2e7ff14;
}
.stage {
  border-radius: 19px; border: 1px solid #bac5f21a;
  background:
    radial-gradient(ellipse at 100% 0, color-mix(in srgb, var(--secondary) 13%, transparent), transparent 62%),
    radial-gradient(ellipse at 0 85%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 65%),
    linear-gradient(#b9c1fa06 1px, transparent 1px), linear-gradient(90deg, #b9c1fa06 1px, transparent 1px), #11172a;
  background-size: auto, auto, 34px 34px, 34px 34px, auto;
  box-shadow: inset 0 1px 0 #e2e7ff12;
}
.label { color: #c5cde4; }
.range-row output { text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type=range] { accent-color: var(--accent); }
select, input[type=text] { background: #232b45; border-color: #7485b070; border-radius: 11px; }
.actions button:first-child { color: #161b2c; background: linear-gradient(125deg, var(--accent), color-mix(in srgb, var(--accent) 72%, white)); border-color: var(--accent); }
.actions button:disabled { opacity: .5; }
.badge { color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, #151b2f); border-color: color-mix(in srgb, var(--accent) 36%, transparent); border-radius: 999px; padding: 4px 11px; }
.person { background: color-mix(in srgb, var(--c) 22%, #181f36); box-shadow: inset 0 1px 0 #ffffff23, 0 5px 18px color-mix(in srgb, var(--c) 10%, transparent); }
.slot { border-color: #c0adff88; }
.slot:nth-child(3n+1) { border-color: #8ecbff88; }
.slot:nth-child(3n+2) { border-color: #8de5bf88; }
.snapshot .item {
  border-radius: 12px; border-color: #a2b8ff29;
  background: linear-gradient(135deg, #829cf313, #829cf303), #1a2239;
  box-shadow: inset 0 1px 0 #ffffff0a;
}
.snapshot .item:nth-child(4n+2) { background: linear-gradient(135deg, #c39afb17, #c39afb03), #201f38; border-color: #c39afb33; }
.snapshot .item:nth-child(4n+3) { background: linear-gradient(135deg, #efb77e17, #efb77e03), #272237; border-color: #efb77e33; }
.snapshot .item:nth-child(4n+4) { background: linear-gradient(135deg, #81dcb217, #81dcb203), #192b35; border-color: #81dcb233; }
.snapshot .item:hover { border-color: var(--accent); }
.stats { gap: 7px; padding: 7px; border-color: #b3b8e52e; border-radius: 22px; background: #b3b8e508; }
.stat { --stat: #9bc9ff; border: 1px solid color-mix(in srgb, var(--stat) 26%, transparent); border-radius: 15px; background: linear-gradient(125deg, color-mix(in srgb, var(--stat) 14%, transparent), transparent), #181e32; }
.stat:nth-child(2) { --stat: #8de5bf; }
.stat:nth-child(3) { --stat: #ffd091; }
.stat:nth-child(4) { --stat: #c6adff; }
.stat:last-child { border: 1px solid color-mix(in srgb, var(--stat) 26%, transparent); }
.stat small { color: #c3cbe0; }
.stat strong { color: var(--stat); }
.explain { border: 1px solid #c6adff3d; border-left: 3px solid var(--accent); border-radius: 16px; background: linear-gradient(110deg, color-mix(in srgb, var(--accent) 12%, transparent), #ba85c70e), #171c30; box-shadow: inset 0 1px 0 #ffffff0c; }
.box { border-color: #a4b8ed33; border-radius: 16px; background: linear-gradient(145deg, #8da4f018, #c79bea08), #171e32; box-shadow: inset 0 1px 0 #ffffff12; }
.relation .box:nth-child(2) { border-color: #f0b59a33; background: linear-gradient(145deg, #e4ad8a17, #cc9ada0a), #201f32; }
.branch { border-radius: 15px; border-color: #b6c8ff55; background: linear-gradient(135deg, #8fa2e61a, #d4a5d113), #202640; box-shadow: inset 0 1px 0 #ffffff14; }
.branches .branch:nth-child(2n) { border-color: #ffcba266; background: #352b3c; }
.tri-row button { border-radius: 10px; background: #282b47; }
.tri-row:nth-child(2n) button { background: #312b48; }
.tri-row button.parent { background: #533e2b; color: #ffda9c; border-color: #ffda9c99; }
.tri-row button.active { background: var(--accent); color: #17182d; }
.terms button.active { background: var(--accent); color: #17182d; }
details { background: #24253a; border: 1px solid #aaa9c332; border-radius: 15px; }
footer { padding: 6px 0; color: #b1b9cf; }
@media (prefers-reduced-motion:no-preference) {
  .intro { animation: color-entry .65s var(--motion) both; }
  .workspace { animation: color-entry .8s var(--motion) both; }
  .slot .person,.bridge-row,.bundle,.gap { animation-timing-function: var(--motion); }
}
@keyframes color-entry { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@media(max-width:900px) { .stat:nth-child(2) { border-right: 1px solid color-mix(in srgb, var(--stat) 26%, transparent); } }
@media(max-width:640px) {
  header { padding-top: 24px; }
  nav { gap: 6px; }
  nav button { padding: 9px 14px; }
  .workspace { padding: 5px; gap: 5px; border-radius: 22px; }
  aside,.stage { border-radius: 16px; }
  aside { border-bottom: 1px solid #bac5f21c; }
  .intro { padding-top: 16px; padding-bottom: 24px; }
  .stats { gap: 5px; padding: 5px; }
  .stat { padding: 12px 10px; }
}

<header><div class="brand"><div class="mark">C</div><div><h1>CountLab <span style="font-weight:400;color:var(--muted)">计数实验室</span></h1><small>计数原理排队实验器 · 先枚举，再归纳</small></div></div><div class="top-actions"><button id="project">投影模式</button><button id="full">全屏</button></div></header>

function updateStats(){const a=A(s.n,s.m),c=C(s.n,s.m);$('stats').innerHTML=[['排列 A(n,m)',fmt(a)],['组合 C(n,m)',fmt(c)],['每组的内部排法',`${s.m}! = ${fmt(fact(s.m))}`],['两种计数的桥梁',`A = C × ${s.m}!`]].map(([l,v])=>`<div class="stat"><small>${l}</small><strong>${v}</strong></div>`).join('');$('stats').classList.toggle('hide',[3,4,5].includes(s.tab))}

function drawPascal(){s.k=Math.min(s.k,s.row);let h=`<div class="stage-top"><span>第 ${s.row} 行 · 第 ${s.k+1} 个数</span><span class="badge">从第 0 行开始编号</span></div><div class="triangle">`;for(let n=0;n<=s.row;n++)h+=`<div class="tri-row">${Array.from({length:n+1},(_,k)=>`<button data-n="${n}" data-k="${k}" class="${n===s.row&&k===s.k?'active':n===s.row-1&&(k===s.k||k===s.k-1)?'parent':''}" aria-label="第 ${n} 行第 ${k+1} 个数 ${C(n,k)}">${C(n,k)}</button>`).join('')}</div>`;h+=`</div><div class="terms"><span class="formula">(a+b)<sup>${s.row}</sup> = </span>${Array.from({length:s.row+1},(_,k)=>`<button data-term="${k}" class="${k===s.k?'active':''} ${k>=s.showTerms?'term-hidden':''}">${k?' + ':''}${term(s.row,k)}</button>`).join('')}</div><div class="box" style="margin-top:20px"><div class="formula">C(${s.row},${s.k}) = ${C(s.row,s.k)}</div><p>${s.row} 个因式中，选 ${s.k} 个位置取 b，其余取 a。每种选择都产生 a<sup>${s.row-s.k}</sup>b<sup>${s.k}</sup>，所以系数为 C(${s.row},${s.k})。</p>${s.row<=6?'<div class="snapshot">'+enumerate(s.row,s.k,false).map(g=>`<div class="item" style="font-family:Consolas">${Array.from({length:s.row},(_,i)=>g.includes(i)?'<span style="color:var(--cyan)">b</span>':'a').join(' · ')||'空乘积 = 1'}</div>`).join('')+'</div>':''}</div>`;$('stage').innerHTML=h;$('stage').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{stop();s.row=+b.dataset.n;s.k=+b.dataset.k;s.showTerms=99;render()});$('stage').querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>{s.k=+b.dataset.term;drawPascal()});tip(`第 n 行第 k+1 个数为 C(n,k)。它数的是从 n 个因式中选择 k 个取 b 的位置；不是凭空出现的系数。`)}
function drawModels(){let step=s.modelStep,h=`<div class="stage-top"><span>模型拆解 · 第 ${step+1} / 4 步</span><span class="badge">5 个不同的人</span></div>`,valid=[],total=0n;if(s.model==='bundle'){valid=enumerate(5,5,true).filter(a=>Math.max(...[0,1,2].map(x=>a.indexOf(x)))-Math.min(...[0,1,2].map(x=>a.indexOf(x)))===2);total=fact(3)*fact(3);h+=`<p>${['条件：a、b、c 必须连续相邻，三人的内部顺序不限。','先把 a、b、c 捆成一个整体，与 d、e 形成 3 个元素。','整体有 3! 种排法，每个整体内部有 3! 种排法。','每个合法队列都可唯一压缩成一个整体队列和一个内部队列。'][step]}</p><div class="model-strip">${step===0?people([0,1,2,3,4]):`<div class="bundle">${people([0,1,2])}</div>${people([3,4])}`}</div>${step>=2?'<div class="formula center">3! × 3! = 36</div>':''}`;tip('指定的三人连续相邻，先整体排，再内部排。漏掉包内的 3!，就漏掉了不同的合法顺序。')}
if(s.model==='gaps'){valid=enumerate(5,5,true).filter(a=>Math.abs(a.indexOf(0)-a.indexOf(1))>1);total=fact(3)*A(4,2);h+=`<p>${['条件：a、b 彼此不相邻，其余三人没有限制。','先排 c、d、e，共 3! 种。含两端在内，有 4 个空隙。','把 a、b 放入不同空隙：先选 2 个空，再安排两人，共 A(4,2) 种。','合法队列唯一对应一种普通人顺序和一种空隙分配。'][step]}</p><div class="model-strip">${step===0?people([0,1,2,3,4]):[0,1,2,3].map((v,i)=>`<span class="gap">${step>=2&&i<2?person(i):'│'}</span>${i<3?person(i+2):''}`).join('')}</div>${step>=2?'<div class="formula center">3! × C(4,2) × 2! = 3! × A(4,2) = 72</div>':''}`;tip('两位指定的人必须进入不同空隙。空隙含两端；人不同，所以还要考虑他们在空隙中的分配。')}
if(s.model==='atleast'){const all=enumerate(5,3,false),bad=all.filter(a=>!a.includes(0)&&!a.includes(1));valid=all.filter(a=>a.includes(0)||a.includes(1));total=C(5,3)-C(3,3);h+=`<p>${['条件：选 3 人组成无职务小组，至少包含 a、b 中的一人。','不考虑限制：从 5 人中选 3 人，共 C(5,3)=10 组。','要减掉的：a、b 都没有，只能从 c、d、e 中选 3 人，共 1 组。','总集合去掉“不含 a、b”的补集，余下恰是所求。'][step]}</p><div class="relation"><div class="box"><h3>全部：10 组</h3><div class="snapshot">${all.map(a=>card(a)).join('')}</div></div><div class="box"><h3>一个都没有：1 组</h3><div class="snapshot">${step>=2?bad.map(a=>card(a)).join(''):'<p>下一步观察要排除的情况</p>'}</div></div></div>${step>=2?'<div class="formula center">C(5,3) − C(3,3) = 10 − 1 = 9</div>':''}`;tip('“至少一个”的反面是“一个都没有”，包含恰好一个和两个都有；直接相加时要防止重复计数。')}
if(step===3)h+=`<div class="box"><h3>独立枚举核对：${valid.length} = ${total}</h3>${grid(valid)}</div>`;h+='<details><summary>拓展 · 隔板法（默认折叠）</summary><p>仅部分教辅涉及，教材不作要求。把 6 个相同物品分给 3 人，每人至少 1 个：在 5 个内部空隙中放 2 块隔板，C(5,2)=10。隔板对应正整数解 x₁+x₂+x₃=6。物品相同、接收者不同、每人至少 1 个是本例的适用条件。</p><div class="formula">● │ ● ● │ ● ● ● → (1,2,3)</div></details>';$('stage').innerHTML=h;pageBind(drawModels)}
function drawVerify(){const f=s.verifyType==='A'?A:C,v=f(s.n,s.m),eligible=s.n<=6,e=eligible?enumerate(s.n,s.m,s.verifyType==='A').length:null;let h=`<div class="relation"><div class="box center"><h3>枚举结果</h3><div class="hero-num">${eligible?e:'—'}</div><p>${eligible?'回溯生成后，实际数出的个数':'n>6：停止枚举，避免阶乘规模的列表'}</p></div><div class="box center"><h3>公式结果 · ${s.verifyType}(${s.n},${s.m})</h3><div class="hero-num" style="font-size:36px">${fmt(v)}</div><p style="overflow-wrap:anywhere">精确整数：${v}</p><div class="formula">${s.verifyType==='A'?`${s.n}! / ${s.n-s.m}!`:`${s.n}! / (${s.m}! × ${s.n-s.m}!)`}</div></div></div><p class="center badge">${eligible?'枚举 = 公式 ✓':'仅显示公式数量 · 量级不等于精确值'}</p><h3>阶乘增长 · 1! → 20!</h3><p class="tiny">纵轴为 log₁₀(n!)：每升高 1，原数量扩大 10 倍。不是线性数量坐标。</p>`;const vals=Array.from({length:20},(_,i)=>Math.log10(Number(fact(i+1)))),points=vals.map((v,i)=>`${45+i*31},${190-v/19*170}`).join(' ');h+=`<svg class="growth" viewBox="0 0 680 220" role="img" aria-label="阶乘对数增长曲线，20的阶乘约为2.43乘10的18次方"><path d="M45 15V190H650" fill="none" stroke="#57718b"/>${[0,5,10,15].map(v=>`<text x="5" y="${194-v/19*170}">${v}</text><path d="M45 ${190-v/19*170}H640" stroke="#253c50"/>`).join('')}<polyline points="${points}" fill="none" stroke="#6ae5dc" stroke-width="3"/>${[0,4,9,14,19].map(i=>`<text x="${40+i*31}" y="212">${i+1}</text>`).join('')}</svg><div class="formula center">20! = 2,432,902,008,176,640,000 ≈ 2.43 × 10<sup>18</sup></div>`;$('stage').innerHTML=h;tip(eligible?'枚举与公式相等，是小规模的验证。公式为何普遍成立，还需要分步计数或等量分组的论证。':'数量增长很快，穷举不再适合呈现；公式仍能给出精确整数。20! 约为 2.43×10¹⁸。')}
